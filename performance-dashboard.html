<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Dashboard</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <style>

        body {
            background: #f4f6f9;
            overflow-x: hidden;
        }

        /* SIDEBAR */

        .sidebar {
            width: 270px;
            min-height: 100vh;
            background: #ffffff;
            border-right: 1px solid #e9ecef;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1040;
            transition: all 0.3s ease;
        }

        .sidebar-header {
            height: 72px;
            border-bottom: 1px solid #e9ecef;
        }

        .sidebar .nav-link {
            color: #495057;
            border-radius: 14px;
            padding: 14px 16px;
            font-weight: 500;
            transition: 0.2s;
        }

        .sidebar .nav-link:hover {
            background: #f1f3f5;
        }

        .sidebar .nav-link.active {
            background: #0d6efd;
            color: white;
        }

        .sidebar .nav-link i {
            font-size: 18px;
        }

        /* MAIN */

        .main-content {
            margin-left: 270px;
            transition: all 0.3s ease;
        }

        /* TOPBAR */

        .topbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e9ecef;
            position: sticky;
            top: 0;
            z-index: 1030;
        }

        /* CARDS */

        .welcome-card {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            border: none;
            border-radius: 22px;
            color: white;
        }

        .custom-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .service-card {
            transition: 0.2s ease;
            cursor: pointer;
        }

        .service-card:hover {
            transform: translateY(-4px);
        }

        .service-icon {
            width: 65px;
            height: 65px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .request-badge {
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 13px;
        }

        /* MOBILE */

        .sidebar-backdrop {
            display: none;
        }

        @media (max-width: 991px) {

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.show {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .sidebar-backdrop.show {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.4);
                z-index: 1035;
            }

        }

        .floating-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 9999;

            padding: 12px 20px;
            border-radius: 50px;

            box-shadow: 0 4px 12px rgba(0,0,0,.25);

            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .fab {
            position: fixed;
            bottom: 25px;
            right: 25px;

            width: 60px;
            height: 60px;

            border-radius: 50%;
            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;

            box-shadow: 0 8px 20px rgba(0,0,0,.3);

            transition: all .2s ease;
        }

        .fab:hover {
            transform: scale(1.08);
        }

    </style>

</head>
<body>

<!-- SIDEBAR BACKDROP -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <!-- TOPBAR -->
    <span id="topbar"></span>

    <!-- PAGE CONTENT -->
    <div class="container-fluid p-3 p-lg-4" id="dashboardBody">

        <button id="btnExportPdf" class="btn btn-danger fab">
            <i class="bi bi-file-earmark-pdf-fill"></i>
        </button>

        <div class="row g-4">

            <!-- BAR CHART -->
            <div class="col-6">

                <div class="card border-0 shadow-sm rounded-4 h-100">

                    <div class="card-header bg-white border-0 pt-4 px-4">

                        <h5 class="fw-bold mb-1">
                            AVERAGE BY EMPLOYEE
                        </h5>

                        <small class="text-muted">
                            Average rating per employee.
                        </small>

                    </div>

                    <div class="card-body">

                        <canvas id="employeeChart" height="400"></canvas>

                    </div>

                </div>

            </div>
            <div class="col-6">

                <div class="card border-0 shadow-sm rounded-4 h-100">

                    <div class="card-header bg-white border-0 pt-4 px-4">

                        <h5 class="fw-bold mb-1">
                            AVERAGE BY DEPARTMENT
                        </h5>

                        <small class="text-muted">
                            Average employee rating per department.
                        </small>

                    </div>

                    <div class="card-body">

                        <canvas id="departmentChart" height="400"></canvas>

                    </div>

                </div>

            </div>

            <!-- PIE CHART -->
            <div class="col-lg-4">

                <div class="card border-0 shadow-sm rounded-4 h-100">

                    <div class="card-header bg-white border-0 pt-4 px-4">

                        <h5 class="fw-bold mb-1">
                            PERFORMANCE DISTRIBUTION
                        </h5>

                        <small class="text-muted">
                            Distribution of employee ratings.
                        </small>

                    </div>

                    <div class="card-body d-flex align-items-center justify-content-center">

                        <canvas id="performancePieChart" height="400"></canvas>

                    </div>

                </div>

            </div>

            <!-- LINE CHART -->
            <div class="col-lg-8">

                <div class="card border-0 shadow-sm rounded-4 h-100">

                    <div class="card-header bg-white border-0 pt-4 px-4">

                        <h5 class="fw-bold mb-1">
                            CAMPUS AVERAGE PER SEMESTER
                        </h5>

                        <small class="text-muted">
                            Average ratings across evaluation periods.
                        </small>

                    </div>

                    <div class="card-body">

                        <canvas id="ratingTrendChart" height="400"></canvas>

                    </div>

                </div>

            </div>

        </div>

    </div>
    <span id="modals"></span>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<!-- FIREBASE CONFIG -->
<script src="assets/js/firebase-config.js"></script>

<!-- CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- functions -->
<script src="assets/js/core-functions.js"></script>
<script src="assets/js/data-functions.js"></script>
<script src="assets/js/chart-data.js"></script>

<script>

    $('#sidebar').load('components/sidebar.html', async function() {
        const session = localStorage.getItem('studentSession');
        let latestRequest = [];
        
        if (!session) {
            window.location.href = 'index.html';
        }
        
        
        let user = await db
        .ref('users/' + JSON.parse(session).idNumber)
        .get();
        
        user = user.val();
        
        console.log("User: ", user.role)
        
        $('#topbar').load('components/topbar.html', async function() {
            $('#modals').load('components/modals.html', async function() {
                populateData(user);
                activateSideBar('performance-dashboard', 'employeePerformanceMenu');
                activateTopBar('Performance Dashboard');
                runACL(user.role);
                await getUserRequests(user.idNumber);
                $('#latest-request').on('click', function () {
                    $('#trackingModal').modal('show');
                });

                loadCharts();

                $("#btnExportPdf").click(async function () {

                    const { jsPDF } = window.jspdf;

                    const element = document.getElementById("dashboardBody");

                    const canvas = await html2canvas(element, {
                        scale: 2,
                        useCORS: true,
                        allowTaint: true,
                        backgroundColor: "#ffffff",
                        scrollY: -window.scrollY
                    });

                    const imgData = canvas.toDataURL("image/png");

                    const pdf = new jsPDF("l", "mm", "a4");

                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();

                    const imgWidth = pdfWidth;
                    const imgHeight = canvas.height * imgWidth / canvas.width;

                    let heightLeft = imgHeight;
                    let position = 0;

                    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);

                    heightLeft -= pdfHeight;

                    while (heightLeft > 0) {

                        position = heightLeft - imgHeight;

                        pdf.addPage();

                        pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);

                        heightLeft -= pdfHeight;
                    }

                    pdf.save("Performance Dashboard.pdf");

                });
            });
        });
    
        // OPEN SIDEBAR
        $('#openSidebar').on('click', function () {
    
            $('#sidebar').addClass('show');
            $('#sidebarBackdrop').addClass('show');
    
        });
    
        // CLOSE SIDEBAR
        $('#closeSidebar, #sidebarBackdrop').on('click', function () {
    
            $('#sidebar').removeClass('show');
            $('#sidebarBackdrop').removeClass('show');
    
        });

        $('#account-reset-card').on('click', function () {
            window.location.href = 'account-reset.html';
        });
    });
    

</script>

</body>
</html>
