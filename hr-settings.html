<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>UV System - HR Settings</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- DATATABLE CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.datatables.net/2.3.2/css/dataTables.bootstrap5.css"
    />

    <style>

        body {
            background: #f4f6f9;
            overflow-x: hidden;
        }

        /* SIDEBAR */

        .sidebar {
            width: 270px;
            min-height: 100vh;
            background: #ffffff;
            border-right: 1px solid #e9ecef;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1040;
            transition: all 0.3s ease;
        }

        .sidebar-header {
            height: 72px;
            border-bottom: 1px solid #e9ecef;
        }

        .sidebar .nav-link {
            color: #495057;
            border-radius: 14px;
            padding: 14px 16px;
            font-weight: 500;
            transition: 0.2s;
        }

        .sidebar .nav-link:hover {
            background: #f1f3f5;
        }

        .sidebar .nav-link.active {
            background: #0d6efd;
            color: white;
        }

        .sidebar .nav-link i {
            font-size: 18px;
        }

        /* MAIN */

        .main-content {
            margin-left: 270px;
            transition: all 0.3s ease;
        }

        /* TOPBAR */

        .topbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e9ecef;
            position: sticky;
            top: 0;
            z-index: 1030;
        }

        /* CARDS */

        .welcome-card {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            border: none;
            border-radius: 22px;
            color: white;
        }

        .custom-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .service-card {
            transition: 0.2s ease;
            cursor: pointer;
        }

        .service-card:hover {
            transform: translateY(-4px);
        }

        .service-icon {
            width: 65px;
            height: 65px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .request-badge {
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 13px;
        }

        /* MOBILE */

        .sidebar-backdrop {
            display: none;
        }

        @media (max-width: 991px) {

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.show {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .sidebar-backdrop.show {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.4);
                z-index: 1035;
            }

        }

    </style>

</head>
<body>

<!-- SIDEBAR BACKDROP -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <!-- TOPBAR -->
    <span id="topbar"></span>

    <!-- PAGE CONTENT -->
    <div class="container-fluid p-3 p-lg-4">

        <!-- PAGE TITLE -->
        <div class="mb-4">

            <h2 class="fw-bold mb-2">
                HR Settings
            </h2>

            <p class="text-muted mb-0">
                View and monitor all the HR Settings (Department, Period, and more).
            </p>

        </div>

        <div class="row g-4">

            <!-- Department Management -->
            <div class="col-12 col-lg-6">

                <div class="card border-0 shadow-sm rounded-4 h-100">

                    <!-- CARD HEADER -->
                    <div class="card-body border-bottom">

                        <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">

                            <div>

                                <h5 class="fw-bold mb-1">
                                    Department Management
                                </h5>

                                <p class="text-muted mb-0">
                                    View and manage departments.
                                </p>

                            </div>

                            <button
                                class="btn btn-success"
                                id="btnAddDepartment"
                                data-bs-toggle="modal"
                                data-bs-target="#addDepartmentModal"
                                >

                                <i class="bi bi-plus me-2"></i>
                                Add Department

                            </button>

                        </div>

                    </div>

                    <!-- TABLE -->
                    <div class="card-body p-0">

                        <div class="table-responsive">

                            <table
                                id="departmentsTable"
                                class="table table-hover align-middle mb-0"
                                width="100%">

                                <thead class="table-light">

                                    <tr>

                                        <th>Department Name</th>

                                        <th>Action</th>

                                    </tr>

                                </thead>

                                <tbody></tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Period Management -->
            <div class="col-12 col-lg-6">

                <div class="card border-0 shadow-sm rounded-4 h-100">

                    <!-- CARD HEADER -->
                    <div class="card-body border-bottom">

                        <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">

                            <div>

                                <h5 class="fw-bold mb-1">
                                    Period Management
                                </h5>

                                <p class="text-muted mb-0">
                                    View and manage periods by semester.
                                </p>

                            </div>

                            <button
                                class="btn btn-success"
                                id="btnAddPeriod"
                                data-bs-toggle="modal"
                                data-bs-target="#addPeriodModal"
                                >

                                <i class="bi bi-plus me-2"></i>
                                Add Period

                            </button>

                        </div>

                    </div>

                    <!-- TABLE -->
                    <div class="card-body p-0">

                        <div class="table-responsive">

                            <table
                                id="periodsTable"
                                class="table table-hover align-middle mb-0"
                                width="100%">

                                <thead class="table-light">

                                    <tr>

                                        <th>Semester</th>

                                        <th>Year Start</th>

                                        <th>Year End</th>

                                        <th>Action</th>

                                    </tr>

                                </thead>

                                <tbody></tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <style>

        #requestHistoryTable thead th {
            font-weight: 600;
            white-space: nowrap;
        }

        .status-badge {
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }

    </style>
    <span id="modals"></span>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- DATATABLE JS -->
<script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>

<script src="https://cdn.datatables.net/2.3.2/js/dataTables.bootstrap5.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<!-- FIREBASE CONFIG -->
<script src="assets/js/firebase-config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<!-- functions -->
<script src="assets/js/core-functions.js"></script>
<script src="assets/js/hr-settings-data.js"></script>

<script>
    
    $('#sidebar').load('components/sidebar.html', async function() {
        $('#topbar').load('components/topbar.html', async function() {
            $('#modals').load('components/modals.html', function() {
                $('#latest-request').on('click', function () {
                    $('#trackingModal').modal('show');
                });
            });
            const session = localStorage.getItem('studentSession');
            let requests = [];
            
            if (!session) {
                window.location.href = 'index.html';
            }
            
            
            let user = await db
                    .ref('users/' + JSON.parse(session).idNumber)
                    .get();
                    
            user = user.val();

            console.log("User: ", user.role)
            
            populateData(user);
            activateSideBar('hr-settings', 'employeePerformanceMenu');
            activateTopBar('HR Settings');
            runACL(user.role);
            loadHrSettings();

            // ADD DEPARTMENT
            $('#addDepartmentForm').on('submit', async function (e) {

                e.preventDefault();

                try {

                    const data = {

                        department: $('#department').val(),

                    };

                    // SAVE DEPARTMENT
                    const departments = db.ref('departments');

                    departments.push(data);

                    alert('User added successfully.');

                    // RESET FORM
                    $('#addDepartmentForm')[0].reset();

                    // CLOSE MODAL
                    $('#addDepartmentForm').modal('hide');

                    // RELOAD TABLE
                    loadHrSettings();

                } catch (error) {

                    console.error(error);

                    alert('Failed to add department.');

                }

            });

            // ADD PERIOD
            $('#addPeriodForm').on('submit', async function (e) {

                e.preventDefault();

                try {

                    const data = {

                        semester: $('#semester').val(),
                        yearStart: $('#startYear').val(),
                        yearEnd: $('#endYear').val(),

                    };

                    // SAVE DEPARTMENT
                    const periods = db.ref('periods');

                    periods.push(data);

                    // RESET FORM
                    // $('#addPeriodForm')[0].reset();

                    // CLOSE MODAL
                    // $('#addPeriodModal').modal('hide');

                    // RELOAD TABLE
                    loadHrSettings();

                } catch (error) {

                    console.error(error);

                    alert('Failed to add department.');

                }

            });
                    
            // OPEN SIDEBAR
            $('#openSidebar').on('click', function () {
        
                $('#sidebar').addClass('show');
                $('#sidebarBackdrop').addClass('show');
        
            });
        
            // CLOSE SIDEBAR
            $('#closeSidebar, #sidebarBackdrop').on('click', function () {
        
                $('#sidebar').removeClass('show');
                $('#sidebarBackdrop').removeClass('show');
        
            });
        });
    });
    

</script>

</body>
</html>
