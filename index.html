<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Portal Login</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <style>
        body {
            background: #f4f6f9;
            min-height: 100vh;
        }

        .login-wrapper {
            min-height: 100vh;
        }

        .login-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .login-left {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            padding: 50px 40px;
        }

        .login-left h1 {
            font-weight: 700;
        }

        .login-right {
            background: white;
            padding: 50px 40px;
        }

        .form-control {
            height: 50px;
            border-radius: 12px;
        }

        .btn-login {
            height: 50px;
            border-radius: 12px;
            font-weight: 600;
        }

        .school-logo {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            background: white;
            padding: 8px;
        }

        @media (max-width: 991px) {
            .login-left {
                display: none;
            }

            .login-right {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>

<div class="container login-wrapper d-flex align-items-center justify-content-center py-4">
    <div class="row w-100 justify-content-center">
        <div class="col-xl-9 col-lg-10">

            <div class="card login-card">
                <div class="row g-0">

                    <!-- Left Side -->
                    <div class="col-lg-6">
                        <div class="login-left h-100 d-flex flex-column justify-content-center">

                            <div class="text-center mb-4">
                                <img
                                    src="https://via.placeholder.com/100"
                                    alt="School Logo"
                                    class="school-logo"
                                />
                            </div>

                            <h1 class="mb-3">
                                Student Support Portal
                            </h1>

                            <p class="mb-0 opacity-75">
                                Access your account requests, monitor request status,
                                and manage your student support services online.
                            </p>

                        </div>
                    </div>

                    <!-- Right Side -->
                    <div class="col-lg-6">
                        <div class="login-right">

                            <div class="mb-4">
                                <h3 class="fw-bold mb-2">
                                    Welcome Back
                                </h3>

                                <p class="text-muted mb-0">
                                    Login using your ID Number and PIN.
                                </p>
                            </div>

                            <form id="loginForm">

                                <!-- ID Number -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        ID Number
                                    </label>

                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-person-badge"></i>
                                        </span>

                                        <input
                                            type="text"
                                            class="form-control"
                                            id="idNumber"
                                            placeholder="Enter your ID Number"
                                            required
                                        />
                                    </div>
                                </div>

                                <!-- PIN -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        PIN
                                    </label>

                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-shield-lock"></i>
                                        </span>

                                        <input
                                            type="password"
                                            class="form-control"
                                            id="pin"
                                            placeholder="Enter your PIN"
                                            required
                                        />

                                        <button
                                            class="btn btn-outline-secondary"
                                            type="button"
                                            id="togglePin"
                                        >
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Login Button -->
                                <div class="d-grid mt-4">
                                    <button
                                        type="submit"
                                        class="btn btn-primary btn-login"
                                    >
                                        Login
                                    </button>
                                </div>

                                <!-- First Time Login -->
                                <div class="text-center mt-4">
                                    <small class="text-muted">
                                        First time using the portal?
                                    </small>

                                    <br />

                                    <a href="setup-pin.html" class="text-decoration-none fw-semibold">
                                        Set up your PIN
                                    </a>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- jQuery CDN -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<!-- CryptoJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

<!-- FIREBASE CONFIG -->
<script src="assets/js/firebase-config.js"></script>

<script>
    // Toggle PIN Visibility
    $('#togglePin').on('click', function () {
        const pinInput = $('#pin');
        const icon = $(this).find('i');

        if (pinInput.attr('type') === 'password') {
            pinInput.attr('type', 'text');
            icon.removeClass('bi-eye').addClass('bi-eye-slash');
        } else {
            pinInput.attr('type', 'password');
            icon.removeClass('bi-eye-slash').addClass('bi-eye');
        }
    });

    // Sample Submit
    // LOGIN FORM
    $('#loginForm').on('submit', async function (e) {

        e.preventDefault();

        const idNumber = $('#idNumber').val().trim();
        const pin = $('#pin').val().trim();

        // VALIDATE
        if (!idNumber || !pin) {
            alert('Please enter your ID Number and PIN.');
            return;
        }

        try {

            // GET USER
            const snapshot = await db
                .ref('users/' + idNumber)
                .get();

            // USER NOT FOUND
            if (!snapshot.exists()) {
                alert('Invalid ID Number or PIN.');
                return;
            }

            // USER DATA
            const user = snapshot.val();

            // HASH INPUT PIN
            const hashedPin = CryptoJS.SHA256(pin).toString();

            // COMPARE PASSWORD
            if (user.password !== hashedPin) {
                alert('Invalid ID Number or PIN.');
                return;
            }

            // SAVE SESSION
            localStorage.setItem('studentSession', JSON.stringify(user));

            // REDIRECT
            window.location.href = 'dashboard.html';

        } catch (error) {

            console.error(error);

            alert('Something went wrong.');

        }

    });
</script>

</body>
</html>
