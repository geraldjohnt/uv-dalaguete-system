<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Set Up PIN</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <style>
        body {
            background: #f4f6f9;
            min-height: 100vh;
        }

        .setup-wrapper {
            min-height: 100vh;
        }

        .setup-card {
            border: none;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .setup-left {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            padding: 50px 40px;
        }

        .setup-right {
            background: white;
            padding: 50px 40px;
        }

        .form-control {
            height: 52px;
            border-radius: 12px;
        }

        .btn-submit {
            height: 52px;
            border-radius: 12px;
            font-weight: 600;
        }

        .school-logo {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: white;
            padding: 8px;
            object-fit: cover;
        }

        .pin-note {
            font-size: 14px;
            color: #6c757d;
        }

        @media (max-width: 991px) {
            .setup-left {
                display: none;
            }

            .setup-right {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>

<div class="container setup-wrapper d-flex align-items-center justify-content-center py-4">
    <div class="row w-100 justify-content-center">
        <div class="col-xl-9 col-lg-10">

            <div class="card setup-card">
                <div class="row g-0">

                    <!-- LEFT -->
                    <div class="col-lg-6">
                        <div class="setup-left h-100 d-flex flex-column justify-content-center">

                            <div class="text-center mb-4">
                                <img
                                    src="https://via.placeholder.com/100"
                                    alt="School Logo"
                                    class="school-logo"
                                />
                            </div>

                            <h2 class="fw-bold mb-3">
                                First Time Access
                            </h2>

                            <p class="mb-0 opacity-75">
                                Set up your secure PIN to access the student
                                support portal and manage your account requests.
                            </p>

                        </div>
                    </div>

                    <!-- RIGHT -->
                    <div class="col-lg-6">
                        <div class="setup-right">

                            <div class="mb-4">
                                <h3 class="fw-bold mb-2">
                                    Set Up Your PIN
                                </h3>

                                <p class="text-muted mb-0">
                                    Verify your account and create your PIN.
                                </p>
                            </div>

                            <form id="setupPinForm">

                                <!-- ID NUMBER -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        ID Number
                                    </label>

                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-person-badge"></i>
                                        </span>

                                        <input
                                            type="text"
                                            class="form-control"
                                            id="idNumber"
                                            placeholder="Enter your ID Number"
                                            required
                                        />
                                    </div>
                                </div>

                                <!-- BIRTHDAY -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        Birthday
                                    </label>

                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-calendar-event"></i>
                                        </span>

                                        <input
                                            type="date"
                                            class="form-control"
                                            id="birthday"
                                            required
                                        />
                                    </div>
                                </div>

                                <!-- PIN -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        Create PIN
                                    </label>

                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-shield-lock"></i>
                                        </span>

                                        <input
                                            type="password"
                                            class="form-control"
                                            id="pin"
                                            maxlength="6"
                                            placeholder="Enter 6-digit PIN"
                                            required
                                        />

                                        <button
                                            type="button"
                                            class="btn btn-outline-secondary toggle-password"
                                            data-target="#pin"
                                        >
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>

                                    <div class="pin-note mt-2">
                                        PIN must contain 6 digits.
                                    </div>
                                </div>

                                <!-- CONFIRM PIN -->
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">
                                        Confirm PIN
                                    </label>

                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-shield-check"></i>
                                        </span>

                                        <input
                                            type="password"
                                            class="form-control"
                                            id="confirmPin"
                                            maxlength="6"
                                            placeholder="Confirm your PIN"
                                            required
                                        />

                                        <button
                                            type="button"
                                            class="btn btn-outline-secondary toggle-password"
                                            data-target="#confirmPin"
                                        >
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- SUBMIT -->
                                <div class="d-grid">
                                    <button
                                        type="submit"
                                        class="btn btn-primary btn-submit"
                                    >
                                        Set Up PIN
                                    </button>
                                </div>

                                <!-- BACK -->
                                <div class="text-center mt-4">
                                    <a
                                        href="index.html"
                                        class="text-decoration-none fw-semibold"
                                    >
                                        <i class="bi bi-arrow-left"></i>
                                        Back to Login
                                    </a>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<!-- CryptoJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

<!-- FIREBASE CONFIG -->
<script src="assets/js/firebase-config.js"></script>

<script>

    // TOGGLE PASSWORD
    $('.toggle-password').on('click', function () {

        const target = $(this).data('target');
        const input = $(target);
        const icon = $(this).find('i');

        if (input.attr('type') === 'password') {
            input.attr('type', 'text');
            icon.removeClass('bi-eye').addClass('bi-eye-slash');
        } else {
            input.attr('type', 'password');
            icon.removeClass('bi-eye-slash').addClass('bi-eye');
        }

    });

    // FORM SUBMIT
    $('#setupPinForm').on('submit', async function (e) {

        e.preventDefault();

        const idNumber = $('#idNumber').val().trim();
        const birthday = $('#birthday').val();
        const pin = $('#pin').val().trim();
        const confirmPin = $('#confirmPin').val().trim();

        console.log("ID Number: ", idNumber)
        console.log("Birthday: ", birthday)

        if (!/^\d{6}$/.test(pin)) {
            alert('PIN must be exactly 6 digits.');
            return;
        }

        if (pin !== confirmPin) {
            alert('PIN does not match.');
            return;
        }

        try {


            // GET USER
            const snapshot = await db
                .ref('users/' + idNumber)
                .get();

            // CHECK IF EXISTS
            if (!snapshot.exists()) {
                alert('User not found.');
                return;
            }

            const user = snapshot.val();

            // CHECK BIRTHDAY
            if (user.birthday !== birthday) {
                alert('Invalid ID Number or Birthday.');
                return;
            }

            // HASH PIN
            const hashedPin = CryptoJS.SHA256(pin).toString();

            // UPDATE PASSWORD
            await db.ref('users/' + idNumber).update({
                password: hashedPin
            });

            alert('PIN setup successful.');

            window.location.href = 'index.html';

        } catch (error) {

            console.error(error);

            alert('Something went wrong.');

        }

    });

</script>

</body>
</html>
